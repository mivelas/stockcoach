<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bullGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="bearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Professional Shield Backdrop -->
  <path d="M100,10 L170,35 Q170,120 100,185 Q30,120 30,35 L100,10 Z" fill="url(#shieldGradient)" stroke="#334155" stroke-width="2" filter="url(#softShadow)" />

  <!-- Bull Silhouette (Left - Green) -->
  <g transform="translate(45, 45) scale(0.45)">
    <path d="M20,100 
             C20,40 80,20 110,20 
             L125,0 Q140,0 145,20 
             C170,30 180,80 180,120 
             L180,180 L20,180 Z" fill="url(#bullGradient)" />
    <!-- Bull Horn Detail -->
    <path d="M110,20 L120,5 Q115,-5 110,0 Z" fill="#064e3b" opacity="0.6" />
  </g>

  <!-- Bear Silhouette (Right - Red) -->
  <g transform="translate(95, 85) scale(0.45)">
    <path d="M180,80 
             C180,140 120,160 90,160 
             L75,180 Q60,180 55,160 
             C30,150 20,100 20,60 
             L20,0 L180,0 Z" fill="url(#bearGradient)" />
    <!-- Bear Ear Detail -->
    <circle cx="50" cy="40" r="15" fill="#7f1d1d" opacity="0.4" />
  </g>

  <!-- Central Chart Line (The "Coach" / Path) -->
  <path d="M60,110 L90,130 L110,90 L140,110" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M60,110 L90,130 L110,90 L140,110" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

</svg>
